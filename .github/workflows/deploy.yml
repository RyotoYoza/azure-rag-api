name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: terraform init -reconfigure -backend-config="key=ragapi-${{ inputs.environment }}.tfstate"

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=${{ inputs.environment }}.tfvars -var="image_tag=${{ inputs.image_tag }}"

      - name: Open database firewall
        working-directory: infra
        run: |
          RUNNER_IP=$(curl -s ifconfig.me)
          az postgres flexible-server firewall-rule create \
            --resource-group $(terraform output -raw resource_group) \
            --server-name $(terraform output -raw postgres_server_name) \
            --name gh-runner \
            --start-ip-address $RUNNER_IP --end-ip-address $RUNNER_IP

      - name: Ingest knowledge base
        working-directory: infra
        run: |
          KV=$(terraform output -raw key_vault_name)
          export DATABASE_URL=$(az keyvault secret show --vault-name $KV --name database-url --query value -o tsv)
          export AZURE_OPENAI_ENDPOINT=$(terraform output -raw openai_endpoint)
          export AZURE_OPENAI_API_VERSION=$(terraform output -raw openai_api_version)
          export AZURE_OPENAI_CHAT_DEPLOYMENT=$(terraform output -raw chat_deployment)
          export AZURE_OPENAI_EMBED_DEPLOYMENT=$(terraform output -raw embed_deployment)
          export USE_MANAGED_IDENTITY=true
          cd ..
          pip install -r requirements.txt
          python -m app.ingest

      - name: Close database firewall
        if: always()
        working-directory: infra
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group $(terraform output -raw resource_group) \
            --server-name $(terraform output -raw postgres_server_name) \
            --name gh-runner --yes || true

      - name: Smoke test
        working-directory: infra
        run: |
          URL=$(terraform output -raw app_url)
          echo "Deployed to $URL"
          for i in $(seq 1 10); do
            if curl -sf "$URL/health"; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "health check failed"; exit 1

